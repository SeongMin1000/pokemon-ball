<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-S3 TinyML AI Pokemon Capsule Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full Screen Battle Arena Container -->
  <div class="arena-container">
    
    <!-- Top Header & Connection Control Bar -->
    <header class="top-header">
      <div class="brand-title">
        <h1>🔴 AI POKÉMON CAPSULE</h1>
        <span class="badge-tag">GBA ARENA</span>
      </div>

      <div class="connection-controls">
        <div class="status-indicator">
          <span class="status-dot" id="mqttStatusDot"></span>
          <span id="mqttStatusText">오프라인</span>
        </div>

        <div class="config-inputs">
          <input type="text" id="mqttHost" value="localhost" placeholder="IP / Host">
          <input type="text" id="mqttPort" value="9001" placeholder="Port">
          <button class="btn-retro" id="btnConnect">연결</button>
          <button class="btn-retro btn-demo" id="btnDemoCapture" title="하드웨어 연결 없이 브라우저에서 포획 애니메이션을 테스트합니다.">⚡ 데모 시뮬레이션</button>
        </div>
      </div>
    </header>

    <!-- Maximized Battle Stage Layout -->
    <main class="battle-stage">
      
      <!-- [중앙 및 좌측 전체] Battle Arena View -->
      <section class="arena-view" id="battleArenaView">
        <div class="cloud-bg"></div>

        <!-- [좌측 상단] In-Arena AI Prediction Box (replaces old HP box) -->
        <div class="in-arena-ai-box">
          <div class="ai-box-header">
            <span class="ai-box-title">🧠 AI Prediction</span>
            <span class="active-gest-badge" id="activeGestureBadge">대기 중</span>
          </div>
          <div class="ai-box-confidence-list" id="confidenceList">
            <!-- Dynamic Mini Progress Bars Rendered via script.js -->
          </div>
        </div>

        <!-- Wild Pokemon Platform (Top-Right) -->
        <div class="platform platform-wild"></div>

        <!-- Wild Enemy Pokemon Zone (Dual Layer for Smooth Silhouette Cross-Fade) -->
        <div class="enemy-zone">
          <div class="pokemon-sprite-container">
            <img class="pkm-layer pkm-silhouette" id="enemySilhouetteImg" src="" alt="Wild Silhouette">
            <img class="pkm-layer pkm-actual" id="enemyActualImg" src="" alt="Wild Pokemon">
          </div>
        </div>

        <!-- Trainer Platform (Bottom-Left) -->
        <div class="platform platform-trainer"></div>

        <!-- Player / Trainer Zone (with Held Shaking Pokeball) -->
        <div class="trainer-zone">
          <div class="trainer-sprite-box">
            <svg class="trainer-sprite" id="trainerSprite" viewBox="0 0 16 16" shape-rendering="crispEdges">
              <rect x="6" y="2" width="5" height="1" fill="#e53935"/>
              <rect x="5" y="3" width="7" height="2" fill="#e53935"/>
              <rect x="5" y="5" width="7" height="1" fill="#ffffff"/>
              <rect x="5" y="6" width="7" height="1" fill="#212121"/>
              <rect x="6" y="7" width="5" height="1" fill="#212121"/>
              <rect x="7" y="8" width="3" height="1" fill="#ffccbc"/>
              <rect x="6" y="9" width="5" height="5" fill="#e53935"/>
              <rect x="5" y="9" width="1" height="4" fill="#ffffff"/>
              <rect x="11" y="9" width="1" height="4" fill="#ffffff"/>
              <rect x="3" y="7" width="3" height="6" fill="#fbc02d"/>
              <rect x="4" y="6" width="2" height="1" fill="#fbc02d"/>
              <rect x="6" y="14" width="2" height="2" fill="#1e88e5"/>
              <rect x="9" y="14" width="2" height="2" fill="#1e88e5"/>
            </svg>

            <!-- Held Pokeball that wiggles while board is shaking -->
            <div class="held-pokeball" id="heldPokeball"></div>
          </div>
        </div>

        <!-- Dynamic Flying Pokeball Sprite -->
        <div class="pokeball-flying" id="pokeballFlying"></div>

        <!-- White Flash Screen Overlay -->
        <div class="capture-flash-screen" id="captureFlash"></div>
      </section>

      <!-- [우측] Pokédex Grid Panel -->
      <aside class="pokedex-panel">
        <div class="dex-header">
          <span class="dex-title">📖 POKÉDEX (도감)</span>
          <button class="btn-reset-dex" id="btnResetDex">초기화</button>
        </div>
        
        <div class="pokedex-grid" id="pokedexGrid">
          <!-- Dynamic Pokedex Cards Rendered via script.js -->
        </div>
      </aside>
    </main>

    <!-- [하단] Battle Message Dialog Box -->
    <footer class="bottom-dialog-container">
      <div class="battle-dialog-box">
        <div class="dialog-text" id="dialogText">
          <!-- Typewriter Animated Text Rendered via script.js -->
        </div>
        <div class="dialog-arrow"></div>
      </div>
    </footer>

  </div>

  <!-- MQTT Library & Main Game Engine Script -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
