<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokemon Ball</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f9f3e6;--green-bg:#c8e6c9;--green-bg2:#a8d5ba;
  --msgbox:#2e7d32;--card:#fff;--card-shadow:0 2px 8px rgba(139,90,43,.15);
  --accent:#e65100;--gold:#f9a825;--red:#c62828;--green:#43a047;
  --purple:#7b1fa2;--text:#3e2723;--muted:#8d6e63;--border:#d7ccc8;
  --radius:14px;
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;padding:10px}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;
  max-width:960px;margin:0 auto 10px}
.header h1{font-size:1.4rem;color:var(--accent)}
.conn{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);transition:.3s}
.dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.cfg-bar{display:flex;gap:4px}
.cfg-bar input{background:#fff;border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:4px 8px;font-size:.78rem;width:110px}
.cfg-bar button{background:var(--accent);color:#fff;border:none;border-radius:6px;
  padding:4px 12px;cursor:pointer;font-size:.78rem;font-weight:bold}

/* Layout */
.layout{display:grid;grid-template-columns:1fr 280px;gap:12px;max-width:960px;margin:0 auto}
@media(max-width:720px){.layout{grid-template-columns:1fr}}

/* Battle area */
.battle{background:linear-gradient(180deg,var(--green-bg),var(--green-bg2));
  border-radius:var(--radius);padding:20px;min-height:260px;position:relative;
  overflow:hidden;border:2px solid var(--border)}
.battle::before{content:'';position:absolute;bottom:0;left:0;right:0;height:40%;
  background:linear-gradient(180deg,transparent,rgba(76,175,80,.2));border-radius:0 0 12px 12px}

.wild-area{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:140px;position:relative;z-index:1}
.wild-sprite{width:96px;height:96px;image-rendering:pixelated;transition:all .4s ease}
.wild-sprite.silhouette{filter:brightness(0) opacity(.85)}
.wild-sprite.reveal{animation:reveal .5s ease-out}
@keyframes reveal{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.wild-label{font-size:.8rem;color:var(--muted);margin-top:6px}

/* Pokeball throw animation */
.pokeball{position:absolute;width:32px;height:32px;font-size:28px;
  bottom:10px;left:10px;z-index:10;opacity:0;pointer-events:none}
.pokeball.throw{animation:throwBall .8s cubic-bezier(.35,.05,.5,1) forwards}
@keyframes throwBall{
  0%{opacity:1;transform:translate(0,0) rotate(0)}
  40%{transform:translate(120px,-60px) rotate(360deg)}
  100%{opacity:0;transform:translate(240px,-120px) rotate(720deg)}
}
.flash-overlay{position:absolute;inset:0;background:#fff;opacity:0;
  pointer-events:none;z-index:5}
.flash-overlay.active{animation:flash .4s ease-out}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}

/* Message box (Pokemon dialog style) */
.msgbox{background:var(--msgbox);color:#fff;border-radius:10px;padding:10px 14px;
  margin-top:12px;font-size:.85rem;line-height:1.5;min-height:60px;
  border:2px solid #1b5e20}
.msgbox .highlight{color:var(--gold);font-weight:bold}
.msgbox .purple{color:#ce93d8;font-weight:bold}

/* Inference panel (inside message box area) */
.infer{margin-top:8px}
.infer-label{font-size:.75rem;color:rgba(255,255,255,.7);margin-bottom:2px}
.confidence-row{display:flex;align-items:center;gap:6px;margin:2px 0}
.confidence-label{font-weight:bold;font-size:.85rem;min-width:60px}
.bar-track{flex:1;height:14px;background:rgba(0,0,0,.25);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--gold);transition:width .2s ease;border-radius:4px}
.bar-val{font-family:monospace;font-size:.8rem;min-width:36px;text-align:right}

.appear-row{display:flex;justify-content:space-between;font-size:.8rem;margin:1px 0;
  padding:1px 4px;border-radius:3px}
.appear-row.top{background:rgba(255,255,255,.15)}
.appear-row.hidden-row{color:#ce93d8}
.appear-val{font-family:monospace;font-weight:bold}

/* Pokedex */
.pokedex{background:var(--card);border-radius:var(--radius);padding:14px;
  box-shadow:var(--card-shadow);border:2px solid var(--border)}
.pokedex h2{font-size:.9rem;color:var(--red);margin-bottom:10px;
  display:flex;align-items:center;gap:4px}
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex-item{background:#faf5ef;border-radius:8px;padding:6px;text-align:center;
  transition:.3s;border:1px solid transparent}
.dex-item.caught{border-color:var(--green);box-shadow:0 0 6px rgba(67,160,71,.2)}
.dex-item.hidden-entry{border-style:dashed;border-color:var(--purple)}
.dex-item.hidden-entry.caught{border-style:solid}
.dex-sprite{width:48px;height:48px;image-rendering:pixelated;margin:0 auto;display:block}
.dex-sprite.uncaught{filter:brightness(0) opacity(.25)}
.dex-placeholder{width:48px;height:48px;margin:0 auto;display:flex;
  align-items:center;justify-content:center;font-size:1.4rem;color:var(--muted)}
.dex-name{font-size:.68rem;margin-top:2px;color:var(--muted)}
.dex-item.caught .dex-name{color:var(--text);font-weight:bold}
.dex-item.hidden-entry.caught .dex-name{color:var(--purple)}
.dex-check{font-size:.6rem;color:var(--muted)}
.dex-item.caught .dex-check{color:var(--green)}

/* Catch message overlay */
.catch-msg{text-align:center;margin-top:8px}
.catch-msg .gotcha{font-size:1.1rem;font-weight:bold;color:var(--gold)}
.catch-msg .caught-name{font-size:.9rem;color:rgba(255,255,255,.9)}
</style>
</head>
<body>

<div class="header">
  <h1>🔴 Pokemon Ball</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="conn">
      <span class="dot" id="dot"></span>
      <span id="connText">Disconnected</span>
    </div>
    <div class="cfg-bar">
      <input id="host" placeholder="Broker" value="192.168.0.30">
      <input id="wsport" placeholder="WS" value="9001" style="width:50px">
      <button onclick="doConnect()">Connect</button>
    </div>
  </div>
</div>

<div class="layout">
  <!-- Battle + Message area -->
  <div>
    <div class="battle" id="battle">
      <div class="wild-area" id="wildArea">
        <div class="dex-placeholder" style="width:96px;height:96px;font-size:3rem;color:rgba(0,0,0,.3)">?</div>
        <div class="wild-label">A wild POKéMON appeared!</div>
      </div>
      <div class="pokeball" id="pokeball">🔴</div>
      <div class="flash-overlay" id="flash"></div>
    </div>

    <div class="msgbox" id="msgbox">
      <div id="msgText">Shake the board to sense the wild Pokemon...</div>
      <div class="infer" id="inferPanel" style="display:none">
        <div class="infer-label">Current Gesture</div>
        <div class="confidence-row">
          <span class="confidence-label" id="confLabel">—</span>
          <div class="bar-track"><div class="bar-fill" id="confBar" style="width:0%"></div></div>
          <span class="bar-val" id="confVal">0%</span>
        </div>
        <div class="infer-label" style="margin-top:6px">Appearance Probability</div>
        <div id="appearArea"></div>
      </div>
      <div class="catch-msg" id="catchMsg" style="display:none">
        <div class="gotcha">Gotcha!</div>
        <div class="caught-name" id="caughtNameText"></div>
      </div>
    </div>
  </div>

  <!-- Pokedex -->
  <div class="pokedex">
    <h2>📖 POKéDEX</h2>
    <div class="dex-grid" id="dex"></div>
  </div>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
// ---- Pokemon sprite mapping ----
const SPRITES = {
  'Pikachu':25,'Charmander':4,'Squirtle':7,'Ditto':132,
  'Bulbasaur':1,'Charmeleon':5,'Wartortle':8,'Eevee':133,
  'Mewtwo':150,'Mew':151,
};
function spriteUrl(name){
  const id=SPRITES[name];
  if(id) return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
  return null;
}

// ---- State ----
let client=null, config=null, caught=new Set();
let scoreLabels=null, webState='idle';

// ---- localStorage ----
function loadCaught(){try{const s=localStorage.getItem('pokemon_caught');if(s)caught=new Set(JSON.parse(s));}catch(e){}}
function saveCaught(){localStorage.setItem('pokemon_caught',JSON.stringify([...caught]));}

// ---- Helpers ----
function getGesturePokemon(gestureLabel){
  if(!config) return null;
  const m = config.mappings.find(m=>m.gesture===gestureLabel);
  return m ? m.pokemon : null;
}

// ---- Score rendering ----
function renderScores(scores){
  const entries = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const top = entries[0];
  const topLabel = top[0];
  const topScore = top[1];
  const topPokemon = getGesturePokemon(topLabel);

  // Show inference panel
  document.getElementById('inferPanel').style.display = 'block';
  document.getElementById('catchMsg').style.display = 'none';

  // Update confidence bar
  document.getElementById('confLabel').textContent = topLabel.toUpperCase();
  const pct = Math.round(topScore*100);
  document.getElementById('confBar').style.width = pct+'%';
  document.getElementById('confVal').textContent = pct+'%';

  // Update appearance probability
  const hp = config ? (config.hiddenProb||2) : 2;
  const pokeProb = pct;
  const hiddenProb = hp;
  const othersProb = Math.max(0, 100 - pokeProb - hiddenProb);

  const area = document.getElementById('appearArea');
  let html = '';
  if(topPokemon){
    html += `<div class="appear-row top"><span>${topPokemon}</span><span class="appear-val">${pokeProb}%</span></div>`;
  }
  html += `<div class="appear-row hidden-row"><span>${config?config.hidden:'Sanjini'} ★</span><span class="appear-val">${hiddenProb}%</span></div>`;
  html += `<div class="appear-row"><span>Others</span><span class="appear-val">${othersProb}%</span></div>`;
  area.innerHTML = html;

  // Update message
  if(webState === 'idle' || webState === 'sensing'){
    document.getElementById('msgText').innerHTML =
      `Sensing... <span class="highlight">${topLabel.toUpperCase()}</span> detected!`;
  }
}

// ---- Catch animation ----
function playCatchAnimation(pokemonName, isHidden){
  webState = 'catching';

  // Hide inference panel, show catching message
  document.getElementById('inferPanel').style.display = 'none';
  document.getElementById('msgText').innerHTML = 'Throwing Poke Ball...';

  // Throw pokeball
  const ball = document.getElementById('pokeball');
  ball.classList.remove('throw');
  void ball.offsetWidth;
  ball.classList.add('throw');

  // After throw (0.8s): flash + reveal
  setTimeout(()=>{
    const flash = document.getElementById('flash');
    flash.classList.remove('active');
    void flash.offsetWidth;
    flash.classList.add('active');

    // Replace silhouette with real sprite
    const wildArea = document.getElementById('wildArea');
    wildArea.innerHTML = '';
    const img = document.createElement('img');
    img.className = 'wild-sprite reveal';
    const url = spriteUrl(pokemonName);
    if(url){
      img.src = url;
    } else {
      // No sprite (Sanjini etc.) — use emoji
      img.outerHTML = '<div style="font-size:5rem">🌟</div>';
    }
    const label = document.createElement('div');
    label.className = 'wild-label';
    label.style.fontWeight = 'bold';
    label.style.color = isHidden ? 'var(--purple)' : 'var(--text)';
    label.textContent = pokemonName;
    wildArea.appendChild(img.src ? img : document.createElement('div'));
    wildArea.appendChild(label);

    // Show "Gotcha!" message
    document.getElementById('msgText').style.display = 'none';
    const catchMsg = document.getElementById('catchMsg');
    catchMsg.style.display = 'block';
    document.getElementById('caughtNameText').innerHTML = isHidden
      ? '<span class="purple">산지니를 획득했습니다!</span>'
      : `<span class="highlight">${pokemonName}</span> was caught!`;
  }, 800);
}

function resetBattle(){
  webState = 'idle';
  const wildArea = document.getElementById('wildArea');
  wildArea.innerHTML = `
    <div class="dex-placeholder" style="width:96px;height:96px;font-size:3rem;color:rgba(0,0,0,.3)">?</div>
    <div class="wild-label">A wild POKéMON appeared!</div>`;
  document.getElementById('inferPanel').style.display = 'none';
  document.getElementById('catchMsg').style.display = 'none';
  document.getElementById('msgText').style.display = 'block';
  document.getElementById('msgText').textContent = 'Shake the board to sense the wild Pokemon...';
}

// ---- Pokedex ----
function renderDex(){
  if(!config) return;
  const dex = document.getElementById('dex');
  dex.innerHTML = '';
  config.mappings.forEach(m=>{
    const isCaught = caught.has(m.pokemon);
    const url = spriteUrl(m.pokemon);
    const el = document.createElement('div');
    el.className = 'dex-item' + (isCaught?' caught':'');
    let spriteHtml;
    if(url){
      spriteHtml = `<img class="dex-sprite ${isCaught?'':'uncaught'}" src="${url}" alt="${m.pokemon}">`;
    } else {
      spriteHtml = `<div class="dex-placeholder">❓</div>`;
    }
    el.innerHTML = spriteHtml
      + `<div class="dex-name">${isCaught?m.pokemon:'???'}</div>`
      + `<div class="dex-check">${isCaught?'✓':'—'}</div>`;
    dex.appendChild(el);
  });
  // Hidden
  const hCaught = caught.has(config.hidden);
  const hEl = document.createElement('div');
  hEl.className = 'dex-item hidden-entry' + (hCaught?' caught':'');
  hEl.innerHTML = (hCaught
      ? '<div class="dex-sprite" style="font-size:1.6rem">🌟</div>'
      : '<div class="dex-placeholder">🔒</div>')
    + `<div class="dex-name" style="color:${hCaught?'var(--purple)':'var(--muted)'}">${hCaught?config.hidden:'???'}</div>`
    + `<div class="dex-check">${hCaught?'★':'—'}</div>`;
  dex.appendChild(hEl);
}

// ---- Connection ----
function setConnected(on){
  document.getElementById('dot').classList.toggle('on',on);
  document.getElementById('connText').textContent = on?'Connected':'Disconnected';
}

function doConnect(){
  if(client){client.end();client=null;}
  const host=document.getElementById('host').value.trim();
  const port=parseInt(document.getElementById('wsport').value)||9001;
  client=mqtt.connect(`ws://${host}:${port}`,{clientId:'pkb_'+Math.random().toString(16).slice(2,8)});
  client.on('connect',()=>{
    setConnected(true);
    client.subscribe(['pokemon/config','pokemon/scores','pokemon/gesture','pokemon/result']);
  });
  client.on('close',()=>setConnected(false));
  client.on('error',e=>console.error(e));
  client.on('message',(topic,msg)=>{
    const str=msg.toString();
    let d;try{d=JSON.parse(str);}catch(e){return;}
    if(topic==='pokemon/config'){config=d;renderDex();}
    else if(topic==='pokemon/scores'){if(webState!=='catching')renderScores(d);}
    else if(topic==='pokemon/gesture'){
      webState='ready';
      document.getElementById('msgText').innerHTML=
        `<span class="highlight">${d.gesture.toUpperCase()}</span> confirmed! Touch to throw!`;
    }
    else if(topic==='pokemon/result'){
      playCatchAnimation(d.pokemon,d.hidden);
      if(d.pokemon){caught.add(d.pokemon);saveCaught();renderDex();}
      setTimeout(()=>resetBattle(),5000);
    }
  });
}

loadCaught();
window.addEventListener('load',()=>doConnect());
</script>
</body>
</html>
