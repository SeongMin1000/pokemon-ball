<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokemon Ball</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#d4c8a8;--panel:#f5f0e1;--panel-border:#3e2723;
  --dialog-bg:#36582c;--dialog-border:#1b3a12;--text:#fff;--text-dim:#c8d8c0;
  --accent:#e65100;--gold:#f9a825;--red:#c62828;--green:#43a047;--purple:#7b1fa2;
  --font:'Press Start 2P',monospace;
}
body{font-family:var(--font);background:var(--bg);color:#3e2723;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:4px;font-size:10px;line-height:1.6;image-rendering:pixelated}

/* Top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;
  width:100%;max-width:680px;margin-bottom:4px}
.topbar h1{font-size:11px;color:var(--red)}
.conn{display:flex;align-items:center;gap:3px;font-size:8px;color:#555}
.dot{width:7px;height:7px;border-radius:0;background:var(--red);transition:.3s}
.dot.on{background:var(--green)}
.cfg-bar{display:flex;gap:2px}
.cfg-bar input{background:#fff;border:1px solid #888;color:#333;
  border-radius:0;padding:2px 4px;font-size:8px;font-family:var(--font);width:80px}
.cfg-bar button{background:var(--accent);color:#fff;border:none;border-radius:0;
  padding:2px 8px;cursor:pointer;font-size:8px;font-family:var(--font)}

/* Battle area — full background image */
.battle{position:relative;width:100%;max-width:680px;aspect-ratio:4/3;
  background-image:url('battle_bg.jpg');background-size:100% 100%;background-position:center;
  background-repeat:no-repeat;overflow:hidden;border:3px solid var(--panel-border);
  box-shadow:none}

/* Trainer (bottom-left) */
.trainer{position:absolute;bottom:5%;left:4%;width:16%;z-index:3}
.trainer img{width:100%;image-rendering:pixelated;filter:drop-shadow(1px 1px 2px rgba(0,0,0,.4))}
.trainer-fallback{font-size:2rem;text-align:center;filter:drop-shadow(1px 1px 2px rgba(0,0,0,.4))}

/* Wild pokemon (top-right) — LARGE, main focus */
.wild{position:absolute;top:6%;right:6%;width:30%;max-width:140px;z-index:3;
  text-align:center}
.wild img{width:100%;image-rendering:pixelated;filter:drop-shadow(2px 2px 4px rgba(0,0,0,.4))}
.wild.silhouette img{filter:brightness(0) opacity(.9)}
.wild.reveal img{animation:revealPkm .4s steps(4)}
@keyframes revealPkm{0%{transform:scale(0);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.wild-label{font-size:8px;color:#fff;text-shadow:1px 1px 2px #000;margin-top:2px}

/* Pokeball animation — trainer to wild pokemon */
.pokeball{position:absolute;font-size:18px;z-index:10;opacity:0;pointer-events:none;
  bottom:12%;left:12%}
.pokeball.throw{animation:throwArc .7s cubic-bezier(.3,.1,.5,1) forwards}
@keyframes throwArc{
  0%{opacity:1;transform:translate(0,0) rotate(0)}
  50%{transform:translate(160px,-100px) rotate(360deg)}
  100%{opacity:.7;transform:translate(300px,-170px) rotate(720deg)}
}
.pokeball.drop{animation:ballDrop .3s ease-in forwards}
@keyframes ballDrop{to{opacity:1;transform:translate(300px,-140px) scale(.7)}}
.pokeball.shake{animation:ballShake .3s ease-in-out 3}
@keyframes ballShake{0%,100%{transform:translate(300px,-140px) rotate(0)}25%{transform:translate(300px,-140px) rotate(-12deg)}75%{transform:translate(300px,-140px) rotate(12deg)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none}
.flash.active{animation:flashAnim .3s steps(2)}
@keyframes flashAnim{0%{opacity:.6}100%{opacity:0}}

/* AI panel (top-left) — bigger, flat GBA style */
.ai-panel{position:absolute;top:3%;left:3%;width:44%;max-width:280px;z-index:5;
  background:var(--panel);border:2px solid var(--panel-border);border-radius:0;
  padding:6px;font-size:8px;color:#3e2723;box-shadow:none}
.ai-panel .ai-title{font-size:9px;margin-bottom:4px;color:var(--accent);border-bottom:1px solid #ccc;padding-bottom:2px}
.gest-row{display:flex;align-items:center;gap:3px;margin:2px 0}
.gest-label{width:45px;font-size:8px}
.gest-bar{flex:1;height:7px;background:rgba(0,0,0,.15);border:1px solid #aaa;border-radius:0;overflow:hidden}
.gest-fill{height:100%;background:#4fc3f7;transition:width .2s}
.gest-row.top .gest-fill{background:var(--gold)}
.gest-row.top .gest-label{color:var(--red)}
.gest-val{width:24px;font-size:7px;text-align:right}
.appear-section{margin-top:5px;padding-top:3px;border-top:1px solid #ccc}
.appear-title{font-size:7px;color:#888;margin-bottom:2px}
.appear-row{display:flex;justify-content:space-between;font-size:8px;margin:1px 0}
.appear-row.top{font-weight:bold;color:var(--accent)}
.appear-row.hidden-row{color:var(--purple)}
.appear-val{font-size:7px}

/* Pokedex (bottom-right) — small thumbnail grid */
.dex-panel{position:absolute;bottom:4%;right:3%;width:26%;max-width:150px;z-index:5;
  background:var(--panel);border:2px solid var(--panel-border);border-radius:0;
  padding:4px;box-shadow:none}
.dex-title{font-size:7px;color:var(--red);margin-bottom:3px;text-align:center}
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.dex-cell{text-align:center;background:rgba(0,0,0,.06);border:1px solid #ddd;
  padding:2px;border-radius:0}
.dex-cell.caught{border-color:var(--green);background:rgba(67,160,71,.1)}
.dex-cell.hidden-cell{border-style:dashed;border-color:var(--purple)}
.dex-cell.hidden-cell.caught{border-style:solid}
.dex-emoji{font-size:14px;line-height:1.2}
.dex-name{font-size:6px;color:#888;margin-top:1px}
.dex-cell.caught .dex-name{color:#333}
.dex-cell.hidden-cell.caught .dex-name{color:var(--purple)}

/* Dialog box (bottom) — GBA style */
.dialog{width:100%;max-width:680px;background:var(--dialog-bg);
  border:3px solid var(--dialog-border);border-radius:0;padding:8px 12px;
  margin-top:4px;min-height:48px;display:flex;align-items:center}
.dialog-text{color:var(--text);font-size:9px;line-height:1.5}
.dialog-text .hl{color:var(--gold)}
.dialog-text .pk{color:#ffeb3b}
.dialog-text .hidden-text{color:#ce93d8}

@media(max-width:480px){
  .ai-panel{width:50%;font-size:7px}
  .dex-panel{width:34%}
  .trainer{width:14%}
  .wild{width:26%}
  .dialog-text{font-size:8px}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>POKe BALL</h1>
  <div style="display:flex;align-items:center;gap:4px">
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">OFF</span></div>
    <div class="cfg-bar">
      <input id="host" value="192.168.0.30">
      <input id="wsport" value="9001" style="width:35px">
      <button onclick="doConnect()">GO</button>
    </div>
  </div>
</div>

<div class="battle" id="battle">
  <!-- AI panel (top-left, bigger) -->
  <div class="ai-panel" id="aiPanel">
    <div class="ai-title">AI STATUS</div>
    <div id="gestBars" style="color:#888">Waiting...</div>
    <div class="appear-section" id="appearSection" style="display:none">
      <div class="appear-title">APPEARANCE</div>
      <div id="appearArea"></div>
    </div>
  </div>

  <!-- Wild pokemon (top-right, LARGE) -->
  <div class="wild silhouette" id="wildArea">
    <img src="" alt="" id="wildImg" style="display:none">
    <div id="wildPlaceholder" style="font-size:4rem;color:rgba(0,0,0,.5)">?</div>
    <div class="wild-label" id="wildLabel"></div>
  </div>

  <!-- Trainer (bottom-left) -->
  <div class="trainer">
    <img src="trainer.png" alt="" id="trainerImg"
         onerror="this.style.display='none';document.getElementById('trainerFallback').style.display='block'">
    <div class="trainer-fallback" id="trainerFallback" style="display:none">🧑</div>
  </div>

  <!-- Pokedex (bottom-right, small) -->
  <div class="dex-panel">
    <div class="dex-title">POKeDEX</div>
    <div class="dex-grid" id="dexGrid"></div>
  </div>

  <!-- Pokeball + flash -->
  <div class="pokeball" id="pokeball">🔴</div>
  <div class="flash" id="flash"></div>
</div>

<!-- Dialog box (GBA style) -->
<div class="dialog">
  <div class="dialog-text" id="dialogText">보드를 흔들어 포켓몬을 탐색하세요.</div>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
// ---- Pokemon data ----
const SPRITES={
  'Pikachu':25,'Charmander':4,'Squirtle':7,'Ditto':132,
  'Bulbasaur':1,'Charmeleon':5,'Wartortle':8,'Eevee':133,'Mew':151,
};
const POKEMON_EMOJI={
  'Pikachu':'⚡','Charmander':'🔥','Squirtle':'🐢','Ditto':'🧬',
};
function spriteUrl(n){const id=SPRITES[n];return id?`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`:null;}
function getEmoji(n){return POKEMON_EMOJI[n]||'⭐';}

// ---- State ----
let client=null,config=null,caught=new Set();
let webState='idle',gestLabels=null;

function loadCaught(){try{const s=localStorage.getItem('pokemon_caught');if(s)caught=new Set(JSON.parse(s));}catch(e){}}
function saveCaught(){localStorage.setItem('pokemon_caught',JSON.stringify([...caught]));}
function setDialog(html){document.getElementById('dialogText').innerHTML=html;}
function getPokemonForGesture(g){
  if(!config)return null;
  const m=config.mappings.find(m=>m.gesture===g.toLowerCase());
  return m?m.pokemon:null;
}

// ---- Render predict (gesture bars + appearance) ----
function renderPredict(d){
  const probs=d.probabilities||{};
  const entries=Object.entries(probs).sort((a,b)=>b[1]-a[1]);
  const top=d.topGesture||entries[0]?.[0]||'';
  const topPct=entries.find(e=>e[0]===top)?.[1]||0;
  const topPkm=getPokemonForGesture(top);

  // Build gesture bars
  const area=document.getElementById('gestBars');
  if(!gestLabels||gestLabels.length!==entries.length){
    gestLabels=entries.map(e=>e[0]);
    area.innerHTML=entries.map(g=>`
      <div class="gest-row" id="gr_${g[0]}">
        <span class="gest-label">${g[0]}</span>
        <div class="gest-bar"><div class="gest-fill" id="gf_${g[0]}" style="width:0%"></div></div>
        <span class="gest-val" id="gv_${g[0]}">0%</span>
      </div>`).join('');
  }
  entries.forEach(([g,v])=>{
    const f=document.getElementById('gf_'+g);const t=document.getElementById('gv_'+g);
    const r=document.getElementById('gr_'+g);
    if(f)f.style.width=v+'%';if(t)t.textContent=v+'%';
    if(r)r.classList.toggle('top',g===top);
  });

  // Appearance probability section
  const appearSection=document.getElementById('appearSection');
  const appearArea=document.getElementById('appearArea');
  appearSection.style.display='block';
  const hp=config?(config.hiddenProb||2):2;
  let html='';
  // Top pokemon
  if(topPkm){
    html+=`<div class="appear-row top"><span>${getEmoji(topPkm)} ${topPkm}</span><span class="appear-val">${topPct}%</span></div>`;
  }
  // Other pokemon (non-top, non-idle gestures)
  entries.forEach(([g,v])=>{
    if(g===top)return;
    const pkm=getPokemonForGesture(g);
    if(pkm){
      html+=`<div class="appear-row"><span>${getEmoji(pkm)} ${pkm}</span><span class="appear-val">${v}%</span></div>`;
    }
  });
  // Sanjini
  html+=`<div class="appear-row hidden-row"><span>🌟 ${config?config.hidden:'Sanjini'}</span><span class="appear-val">${hp}%</span></div>`;
  appearArea.innerHTML=html;

  // Dialog
  if(webState==='idle'||webState==='sensing'){
    webState='sensing';
    if(topPkm && topPct>20){
      setDialog(`Touch Sensor를 눌러 몬스터볼을 던지세요.`);
    }else{
      setDialog(`제스처를 분석 중... <span class="hl">${top}</span> ${topPct}%`);
    }
  }
}

// ---- Catch animation ----
function playCaptureAnim(pokemon,isHidden){
  webState='catching';
  setDialog('가랏! <span class="hl">몬스터볼!</span>');

  const ball=document.getElementById('pokeball');
  ball.className='pokeball throw';
  void ball.offsetWidth;

  setTimeout(()=>{ball.className='pokeball drop';setDialog('...');},700);
  setTimeout(()=>{ball.className='pokeball shake';},1000);

  setTimeout(()=>{
    const flash=document.getElementById('flash');
    flash.classList.remove('active');void flash.offsetWidth;flash.classList.add('active');
    ball.style.opacity='0';

    const wild=document.getElementById('wildArea');
    wild.className='wild reveal';
    const img=document.getElementById('wildImg');
    const ph=document.getElementById('wildPlaceholder');
    const label=document.getElementById('wildLabel');
    const url=spriteUrl(pokemon);
    if(url){img.src=url;img.style.display='block';ph.style.display='none';}
    else{ph.style.display='block';ph.textContent='🌟';ph.style.fontSize='4rem';}
    label.textContent=pokemon;
    label.style.fontWeight='bold';
    label.style.color=isHidden?'#ce93d8':'#fff';

    if(isHidden) setDialog(`Gotcha!<br><span class="hidden-text">산지니를 획득했다!</span>`);
    else setDialog(`Gotcha!<br><span class="pk">${pokemon}</span> was caught!`);
  },2200);

  setTimeout(()=>resetBattle(),6000);
}

function resetBattle(){
  webState='idle';
  const wild=document.getElementById('wildArea');
  wild.className='wild silhouette';
  document.getElementById('wildImg').style.display='none';
  const ph=document.getElementById('wildPlaceholder');
  ph.style.display='block';ph.style.fontSize='4rem';ph.style.color='rgba(0,0,0,.5)';ph.textContent='?';
  document.getElementById('wildLabel').textContent='';
  document.getElementById('pokeball').className='pokeball';
  setDialog('보드를 흔들어 포켓몬을 탐색하세요.');
}

// ---- Pokedex (emoji thumbnails, no images) ----
function renderDex(){
  if(!config)return;
  const grid=document.getElementById('dexGrid');
  grid.innerHTML='';
  config.mappings.forEach(m=>{
    const isCaught=caught.has(m.pokemon);
    const el=document.createElement('div');
    el.className='dex-cell'+(isCaught?' caught':'');
    el.innerHTML=`<div class="dex-emoji" style="${isCaught?'':'filter:grayscale(1) opacity(.35)'}">${getEmoji(m.pokemon)}</div>`
      +`<div class="dex-name">${isCaught?m.pokemon:'???'}</div>`;
    grid.appendChild(el);
  });
  // Hidden
  const hCaught=caught.has(config.hidden);
  const hEl=document.createElement('div');
  hEl.className='dex-cell hidden-cell'+(hCaught?' caught':'');
  hEl.innerHTML=`<div class="dex-emoji">${hCaught?'🌟':'❓'}</div>`
    +`<div class="dex-name" style="color:${hCaught?'var(--purple)':'#999'}">${hCaught?config.hidden:'???'}</div>`;
  grid.appendChild(hEl);
}

// ---- Connection ----
function setConnected(on){
  document.getElementById('dot').classList.toggle('on',on);
  document.getElementById('connText').textContent=on?'ON':'OFF';
}

function doConnect(){
  if(client){client.end();client=null;}
  const h=document.getElementById('host').value.trim();
  const p=parseInt(document.getElementById('wsport').value)||9001;
  client=mqtt.connect(`ws://${h}:${p}`,{clientId:'pkb_'+Math.random().toString(16).slice(2,8)});
  client.on('connect',()=>{
    setConnected(true);
    client.subscribe(['pokemon/config','pokemon/predict','pokemon/capture']);
  });
  client.on('close',()=>setConnected(false));
  client.on('error',e=>console.error(e));
  client.on('message',(topic,msg)=>{
    const str=msg.toString();let d;try{d=JSON.parse(str);}catch(e){return;}
    if(topic==='pokemon/config'){config=d;renderDex();}
    else if(topic==='pokemon/predict'){if(webState!=='catching')renderPredict(d);}
    else if(topic==='pokemon/capture'){
      playCaptureAnim(d.pokemon,d.hidden);
      if(d.pokemon){caught.add(d.pokemon);saveCaught();renderDex();}
    }
  });
}

loadCaught();
window.addEventListener('load',()=>doConnect());
</script>
</body>
</html>
